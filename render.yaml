services:
  - type: web
    name: chs-portal-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev
    # Applies any new packages/db/sql migrations (already-applied ones are
    # skipped) before the API starts, so a deploy never runs new code
    # against an old schema.
    startCommand: npm run db:migrate && npm run start --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: ALLOW_PASSWORD_LOGIN
        value: "true"
      - key: WEB_ORIGIN
        value: https://chs-portal-web.onrender.com
      - key: PORTAL_BASE_URL
        value: https://chs-portal-web.onrender.com
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: ../../storage
      - key: STORAGE_SIGNED_URL_TTL_MINUTES
        value: "10"
      # Email for MFA + password-reset codes (see .env.example). Sign-in
      # by emailed code fails until these are set in the Render dashboard.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Render's free plan blocks SMTP ports; set this to send via Brevo's API instead.
      - key: BREVO_API_KEY
        sync: false

  - type: web
    name: chs-portal-web
    runtime: node
    plan: free
    # --include=dev: Next.js needs the "typescript" package (a
    # devDependency) present at build time to read the "@/*" path
    # aliases from tsconfig.json — without it every "@/..." import
    # fails to resolve. Render sets NODE_ENV=production before install,
    # which makes plain "npm install" skip devDependencies otherwise.
    buildCommand: npm install --include=dev && npm run build --workspace=apps/web
    startCommand: npm run start --workspace=apps/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://chs-portal-api.onrender.com
